<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Surprise from Sayem</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #141e30, #243b55);
      font-family: 'Segoe UI', sans-serif;
      color: white;
      text-align: center;
    }

    .container {
      padding: 40px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border-radius: 2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      margin-bottom: 20px;
    }

    p {
      font-size: clamp(1rem, 3vw, 1.3rem);
      margin-bottom: 30px;
    }

    button {
      padding: 1rem 2rem;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 1rem;
      background: #00d4ff;
      color: black;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      transform: scale(1.1);
      background: #00ff88;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Here is a surprise for you from Sayem</h1>
    <p>Open it or regret</p>
    <button onclick="window.location.href='love.html'">Open</button>
  </div>
</body>
</html>
