<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>You Love Me!</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      padding: 3rem;
      border-radius: 2rem;
      backdrop-filter: blur(15px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      max-width: 90vw;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      margin-bottom: 1rem;
      color: #00ff88;
    }

    p {
      font-size: clamp(1.2rem, 3vw, 1.5rem);
      line-height: 1.6;
      color: #f0f0f0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>YAY! You said YES!</h1>
    <p>
      That means a lot to me.<br>
      I'm really happy to know that you love me too.<br>
      From Sayem — with love.
    </p>
  </div>
</body>
</html>
